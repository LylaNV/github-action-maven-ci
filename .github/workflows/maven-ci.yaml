name: maven Github Actions
on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
jobs:
    test:
        name: Run test for maven
        runs-on: ubuntu-latest
        steps:
            - name: get source code
              uses: actions/checkout@v6
            - name: set up JDK 17
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '17'
            - name: running maven test
              run: mvn test

    build:
        needs: test
        name: building maven
        runs-on: ubuntu-latest
        steps:
            - name: get source code
              uses: actions/checkout@v6
            - name: set up JDK 17
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '17'
            - name: building jar file
              run: mvn clean package